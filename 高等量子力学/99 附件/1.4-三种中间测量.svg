<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="820" viewBox="0 0 1160 820" role="img" aria-labelledby="title desc">
  <title id="title">同一个 z 正自旋态，三种不同的中间操作</title>
  <desc id="desc">以已制备的 z 正束流为一。不做中间测量，最后得到 z 负的概率为零；测量 x 分量并保留全部结果、忽略标签，概率为二分之一；只保留 x 正分支，最终 z 负束流占最初的四分之一。相对于已经通过 x 正筛选的束流，最后的条件概率为二分之一。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#63738a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1160" height="820" rx="22" fill="#f6f8fc"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#17253f">
    <text x="46" y="57" font-size="29" font-weight="700">同一个初态，三种中间操作</text>
    <text x="46" y="96" font-size="20" fill="#52637b">初态均为 |z+⟩；将这束已制备好的粒子数归一化为 1，最后都测量 z 分量。</text>

    <rect x="46" y="129" width="1068" height="181" rx="16" fill="#fff" stroke="#bed1eb" stroke-width="2"/>
    <text x="70" y="169" font-size="23" font-weight="700" fill="#245e99">① 不进行中间测量</text>
    <text x="83" y="227" font-size="27">|z+⟩</text>
    <path d="M186,217 H298" stroke="#63738a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="317" y="191" width="241" height="51" rx="9" fill="#e9f1fa"/>
    <text x="346" y="225" font-size="22">直接测量 z 分量</text>
    <text x="71" y="283" font-size="19" fill="#52637b">若用 x 基展开振幅：+1/2 与 −1/2 相加，恰好抵消。</text>
    <line x1="804" y1="155" x2="804" y2="285" stroke="#dce3ee"/>
    <text x="838" y="187" font-size="18" fill="#52637b">最后得到 z− 的比例</text>
    <text x="931" y="256" text-anchor="middle" font-size="48" fill="#245e99" font-weight="700">0</text>

    <rect x="46" y="329" width="1068" height="181" rx="16" fill="#fff" stroke="#b9dacd" stroke-width="2"/>
    <text x="70" y="369" font-size="23" font-weight="700" fill="#226c56">② 测量 x 分量，保留两种结果，忽略标签</text>
    <text x="83" y="427" font-size="27">|z+⟩</text>
    <path d="M186,417 H237" stroke="#63738a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="254" y="390" width="246" height="54" rx="9" fill="#e8f4ee"/>
    <text x="273" y="425" font-size="21">x+、x− 各占 1/2</text>
    <path d="M516,417 H571" stroke="#63738a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="592" y="425" font-size="21">分别测 z</text>
    <text x="71" y="483" font-size="19" fill="#52637b">两条已区分分支的概率相加：1/4 + 1/4 = 1/2。</text>
    <line x1="804" y1="355" x2="804" y2="485" stroke="#dce3ee"/>
    <text x="838" y="387" font-size="18" fill="#52637b">最后得到 z− 的比例</text>
    <text x="931" y="456" text-anchor="middle" font-size="48" fill="#226c56" font-weight="700">1/2</text>

    <rect x="46" y="529" width="1068" height="181" rx="16" fill="#fff" stroke="#e8d1a7" stroke-width="2"/>
    <text x="70" y="569" font-size="23" font-weight="700" fill="#916018">③ 测量 x 分量，只让 x+ 通过</text>
    <text x="83" y="627" font-size="27">|z+⟩</text>
    <path d="M186,617 H237" stroke="#63738a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="254" y="590" width="246" height="54" rx="9" fill="#fcf2df"/>
    <text x="285" y="625" font-size="21">保留 x+：1/2</text>
    <path d="M516,617 H571" stroke="#63738a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="592" y="625" font-size="21">再测 z</text>
    <text x="71" y="683" font-size="19" fill="#52637b">先通过 x+，再得到 z−：1/2 × 1/2 = 1/4。</text>
    <line x1="804" y1="555" x2="804" y2="685" stroke="#dce3ee"/>
    <text x="838" y="587" font-size="18" fill="#52637b">最后得到 z− 的比例</text>
    <text x="931" y="656" text-anchor="middle" font-size="48" fill="#916018" font-weight="700">1/4</text>

    <text x="48" y="756" font-size="20" font-weight="700">分母要一致：右侧都相对于最初已经制备的 z+ 束流。</text>
    <text x="48" y="792" font-size="18" fill="#52637b">在第 ③ 种实验中，若只看已通过 x+ 筛选的粒子，随后得到 z− 的条件概率仍是 1/2。</text>
  </g>
</svg>
