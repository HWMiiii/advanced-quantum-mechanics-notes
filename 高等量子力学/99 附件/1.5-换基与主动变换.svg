<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">同一个态换基与主动改变状态的区别</title>
  <desc id="desc">U 的列是新基在旧基中的坐标。同一个 z 正态从 z 基改写到 y 基，用 U 的伴随，坐标从一零变为一一除以根号二；主动作用 U 则在固定 z 基得到 y 正态，沿 z 测量的正结果概率从一变为二分之一。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563a5"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b65b24"/></marker>
  </defs>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172a40}
    .title{font-size:32px;font-weight:700}
    .head{font-size:25px;font-weight:700}
    .body{font-size:22px}
    .small{font-size:19px;fill:#53677c}
    .math{font-family:"Cambria Math","Microsoft YaHei",serif;font-size:28px}
    .accent{fill:#2563a5}
    .orange{fill:#a54c1b}
    .sub{font-size:70%;baseline-shift:sub}
    .sup{font-size:70%;baseline-shift:super}
  </style>
  <rect width="1200" height="930" fill="#f5f7fb"/>
  <text x="54" y="61" class="title">基的改变：先分清“换坐标”与“改变态”</text>
  <text x="54" y="103" class="body">约定：U 的第 j 列，是新基矢在旧基中的坐标。</text>
  <rect x="54" y="130" width="1092" height="65" rx="12" fill="#e7edf6"/>
  <text x="80" y="171" class="body">基矢：|bⱼ⟩ = 𝒰|aⱼ⟩</text>
  <text x="467" y="171" class="body">同一态的坐标：c<tspan class="sub">旧</tspan> = U c<tspan class="sub">新</tspan>，所以 c<tspan class="sub">新</tspan> = U† c<tspan class="sub">旧</tspan></text>

  <rect x="54" y="220" width="1092" height="275" rx="16" fill="#ffffff" stroke="#c8d9ed" stroke-width="2"/>
  <rect x="54" y="220" width="9" height="275" rx="4" fill="#2563a5"/>
  <text x="82" y="265" class="head accent">① 被动换基：同一个 |z+⟩，从 z 基改用 y 基描述</text>
  <text x="92" y="312" class="small">旧基中的坐标</text>
  <text x="92" y="358" class="math">c<tspan class="sub">z</tspan> = (1, 0)ᵀ</text>
  <text x="478" y="313" class="body accent">乘 U<tspan class="sub">y</tspan><tspan class="sup">†</tspan></text>
  <path d="M428 351 H695" stroke="#2563a5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="752" y="312" class="small">新基中的坐标</text>
  <text x="752" y="358" class="math">c<tspan class="sub">y</tspan> = (1, 1)ᵀ / √2</text>
  <line x1="82" y1="389" x2="1118" y2="389" stroke="#dfE7f0"/>
  <text x="92" y="425" class="body">算符也改写：X<tspan class="sub">y</tspan> = U<tspan class="sub">y</tspan><tspan class="sup">†</tspan> X<tspan class="sub">z</tspan> U<tspan class="sub">y</tspan></text>
  <text x="92" y="464" class="body">同一测量事件：p(z+) = 1。态没有改变，改的是表示它的数字。</text>

  <rect x="54" y="521" width="1092" height="275" rx="16" fill="#ffffff" stroke="#edd3bd" stroke-width="2"/>
  <rect x="54" y="521" width="9" height="275" rx="4" fill="#b65b24"/>
  <text x="82" y="567" class="head orange">② 主动变换态：固定使用 z 基，对输入态作用 𝒰<tspan class="sub">y</tspan></text>
  <text x="92" y="614" class="small">原态 |z+⟩，仍用 z 基</text>
  <text x="92" y="660" class="math">c<tspan class="sub">z</tspan> = (1, 0)ᵀ</text>
  <text x="479" y="614" class="body orange">乘 U<tspan class="sub">y</tspan></text>
  <path d="M428 653 H695" stroke="#b65b24" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <text x="752" y="614" class="small">新态 |y+⟩，仍用 z 基</text>
  <text x="752" y="660" class="math">c′<tspan class="sub">z</tspan> = (1, i)ᵀ / √2</text>
  <line x1="82" y1="691" x2="1118" y2="691" stroke="#f0e3d8"/>
  <text x="92" y="727" class="body">固定测量 S<tspan class="sub">z</tspan>：输入从 |z+⟩ 变成 |y+⟩。</text>
  <text x="92" y="766" class="body">因此 p(z+) 从 1 变成 1/2。此时系统的状态发生了改变。</text>

  <text x="54" y="844" class="small">本图取 |y±⟩ = (|z+⟩ ± i|z−⟩) / √2，U<tspan class="sub">y</tspan> 的两列依次为这两个基矢的 z 坐标。</text>
  <text x="54" y="879" class="small">基变换保持同一物理问题的预测；固定测量只变换输入态，概率通常会改变。</text>
</svg>
