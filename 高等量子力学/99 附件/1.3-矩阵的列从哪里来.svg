<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">矩阵的每一列，来自算符对一个基矢的作用</title>
  <desc id="desc">在按正态、负态排列的 z 基底中，升算符作用于正态给出零向量，构成第一列；作用于负态给出 hbar 倍正态，构成第二列。于是矩阵为 hbar 乘以零一、零零矩阵。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#64748b" stroke-width="1.8"/></marker>
  </defs>
  <rect width="1120" height="690" rx="22" fill="#f6f8fc"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#17253f">
    <text x="48" y="59" font-size="28" font-weight="700">矩阵的每一列，从哪里来？</text>
    <text x="48" y="94" font-size="18" fill="#52637b">选定有序基底  ( |+⟩ , |−⟩ )，分别让算符作用于每一个基矢。</text>
    <rect x="48" y="124" width="1024" height="61" rx="12" fill="#e8eef8"/>
    <text x="76" y="162" font-size="22">矩阵元  Xᵢⱼ = ⟨aᵢ|X|aⱼ⟩</text>
    <text x="574" y="162" font-size="20" fill="#365a83">j：输入的基矢 → 列　　i：输出的分量 → 行</text>

    <rect x="48" y="214" width="498" height="190" rx="16" fill="#ffffff" stroke="#c5d8ef" stroke-width="2"/>
    <rect x="574" y="214" width="498" height="190" rx="16" fill="#ffffff" stroke="#efdbb1" stroke-width="2"/>
    <text x="72" y="252" font-size="21" font-weight="700" fill="#245e99">第 1 列：输入 |+⟩</text>
    <text x="598" y="252" font-size="21" font-weight="700" fill="#986312">第 2 列：输入 |−⟩</text>
    <text x="85" y="313" font-size="28">S₊ |+⟩ = 0</text>
    <path d="M283,304 H353" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M404,278 H390 V356 H404 M445,278 H459 V356 H445" fill="none" stroke="#245e99" stroke-width="2.5"/>
    <text x="416" y="306" font-size="25" fill="#245e99">0</text>
    <text x="416" y="344" font-size="25" fill="#245e99">0</text>
    <text x="73" y="380" font-size="17" fill="#52637b">零向量的两分量均为 0。</text>
    <text x="610" y="313" font-size="28">S₊ |−⟩ = ℏ |+⟩</text>
    <path d="M842,304 H897" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M944,278 H930 V356 H944 M992,278 H1006 V356 H992" fill="none" stroke="#986312" stroke-width="2.5"/>
    <text x="953" y="306" font-size="25" fill="#986312">ℏ</text>
    <text x="955" y="344" font-size="25" fill="#986312">0</text>
    <text x="599" y="380" font-size="17" fill="#52637b">正分量是 ℏ，负分量是 0。</text>

    <rect x="48" y="430" width="1024" height="192" rx="16" fill="#ffffff" stroke="#d5ddeb"/>
    <text x="77" y="458" font-size="20" font-weight="700">按基底顺序，把两列并排放好：</text>
    <text x="84" y="552" font-size="34">[S₊]<tspan baseline-shift="sub" font-size="20">z</tspan><tspan> =</tspan></text>
    <rect x="263" y="495" width="59" height="95" rx="8" fill="#e8f1fb"/>
    <rect x="335" y="495" width="59" height="95" rx="8" fill="#fcf3df"/>
    <text x="280" y="485" font-size="18" fill="#245e99">|+⟩</text>
    <text x="350" y="485" font-size="18" fill="#986312">|−⟩</text>
    <path d="M253,494 H241 V592 H253 M407,494 H419 V592 H407" fill="none" stroke="#17253f" stroke-width="2.5"/>
    <text x="282" y="534" font-size="29" fill="#245e99">0</text>
    <text x="282" y="576" font-size="29" fill="#245e99">0</text>
    <text x="351" y="534" font-size="29" fill="#986312">ℏ</text>
    <text x="352" y="576" font-size="29" fill="#986312">0</text>
    <text x="442" y="533" font-size="18" fill="#52637b">← |+⟩ 分量</text>
    <text x="442" y="575" font-size="18" fill="#52637b">← |−⟩ 分量</text>
    <text x="698" y="527" font-size="22" font-weight="700">读列：输入是谁？</text>
    <text x="698" y="566" font-size="22" font-weight="700">读行：输出在哪个方向？</text>
    <text x="49" y="658" font-size="17" fill="#52637b">教学示意：0 表示零向量或零分量；S₊ 将 S<tspan baseline-shift="sub" font-size="12">z</tspan><tspan> 的本征值提高 ℏ，不改变自旋量子数 s = 1/2。</tspan></text>
  </g>
</svg>
