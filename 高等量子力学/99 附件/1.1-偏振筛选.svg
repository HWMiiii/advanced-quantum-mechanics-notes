<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">三片偏振片：x、45度、y</title>
  <desc id="desc">x 与 y 偏振片直接相接时不透光。中间插入45度偏振片后，以第一片之后的强度为一，第二片之后为二分之一，第三片之后为四分之一。</desc>
  <rect width="1040" height="430" rx="16" fill="#ffffff"/>
  <defs><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182536;font-size:22px}
    .small{font-size:18px;fill:#536275}
    .h{font-size:26px;font-weight:600}
    .disk{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}
    .axis{stroke:#1865b7;stroke-width:5;stroke-linecap:round}
    .wire{stroke:#64748b;stroke-width:2;marker-end:url(#pa)}
  </style>
  <text class="h" x="40" y="48">多放一片偏振片，为什么反而有光通过？</text>
  <text class="small" x="40" y="83">强度均以第一片之后的 I₁ 为基准。圆中的线表示透射轴。</text>
  <text x="45" y="158">直接串联</text>
  <circle class="disk" cx="258" cy="154" r="39"/>
  <line class="axis" x1="233" y1="154" x2="283" y2="154"/>
  <line class="wire" x1="303" y1="154" x2="671" y2="154"/>
  <text class="small" x="439" y="141">强度 I₁</text>
  <circle class="disk" cx="716" cy="154" r="39"/>
  <line class="axis" x1="716" y1="129" x2="716" y2="179"/>
  <line class="wire" x1="761" y1="154" x2="873" y2="154"/>
  <text x="898" y="162">0</text>
  <text class="small" x="221" y="216">x 偏振片</text>
  <text class="small" x="680" y="216">y 偏振片</text>
  <line x1="40" y1="244" x2="995" y2="244" stroke="#dbe3ec"/>
  <text x="45" y="312">加入 45°</text>
  <circle class="disk" cx="258" cy="304" r="39"/>
  <line class="axis" x1="233" y1="304" x2="283" y2="304"/>
  <line class="wire" x1="303" y1="304" x2="439" y2="304"/>
  <text class="small" x="349" y="289">I₁</text>
  <circle class="disk" cx="487" cy="304" r="39"/>
  <line class="axis" x1="469" y1="322" x2="505" y2="286"/>
  <line class="wire" x1="532" y1="304" x2="671" y2="304"/>
  <text class="small" x="572" y="289">I₁ / 2</text>
  <circle class="disk" cx="716" cy="304" r="39"/>
  <line class="axis" x1="716" y1="279" x2="716" y2="329"/>
  <line class="wire" x1="761" y1="304" x2="873" y2="304"/>
  <text x="891" y="312">I₁ / 4</text>
  <text class="small" x="221" y="368">x 偏振片</text>
  <text class="small" x="443" y="368">45° 偏振片</text>
  <text class="small" x="680" y="368">y 偏振片</text>
  <text class="small" x="257" y="405">每经过一片，与入射偏振相差 45°，强度乘以 1/2。</text>
</svg>
